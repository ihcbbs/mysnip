cat > /etc/sysctl.d/99-network.conf <<'EOF'
# --- 系统基础 ---
fs.file-max = 1000000          # 8GB 以下内存建议 1M；大内存机器可回 2M
vm.swappiness = 10
# vm.overcommit_memory 默认 0，除非跑 Redis 否则别开 1

net.core.somaxconn = 32768
net.core.netdev_max_backlog = 16384

# --- 缓冲：default 克制，只放大 max ---
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 131072

net.ipv4.tcp_rmem = 4096 131072 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# --- TCP 特性 ---
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3
# tcp_ecn 视实测决定：链路质量好可开 1，跨境不稳定就 0

# --- 拥塞控制 ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# --- 连接管理 ---
net.ipv4.tcp_max_tw_buckets = 524288
# tcp_tw_reuse 仅出站代理/爬虫场景需要，纯入站服务器可删
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_max_syn_backlog = 32768
net.ipv4.tcp_syncookies = 1

# --- 转发 & conntrack（确需转发才保留）---
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.netfilter.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
EOF

# conntrack hash 表随模块参数设置（下次重启或 rmmod 后生效）
echo "options nf_conntrack hashsize=131072" > /etc/modprobe.d/nf_conntrack.conf

sysctl --system
