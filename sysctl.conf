# /etc/sysctl.d/99-selfhosted.conf

# --- 基础 ---
fs.file-max = 1048576

# --- 内存：不要设 overcommit_memory=1，避免 OOM 杀进程 ---
vm.swappiness = 10

# --- BBR（KVM/完全虚拟化才有效；LXC/OpenVZ 删掉这段）---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# --- 缓冲区：max 16MB 对个人带宽绰绰有余，default 保持系统默认 ---
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216

# --- TCP 长连接保活 ---
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_slow_start_after_idle = 0

# --- 转发：仅当用 TProxy/透明代理/端口转发时保留，否则删掉 ---
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# --- conntrack：仅当用 ufw/NAT 时有效；内存 <2GB 建议 max 降到 131072 ---
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
